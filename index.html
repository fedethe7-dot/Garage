<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Garage</title>
  <meta name="description" content="Gestione personale dei veicoli: rifornimenti, consumi, manutenzione, spese e statistiche.">
  <meta name="theme-color" content="#0e1014">
  <link rel="manifest" href="manifest.json?v=256">
  <link rel="icon" href="icona-garage.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icona-garage-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=256">
  <link rel="stylesheet" href="minimal.css?v=256">
  <link rel="stylesheet" href="glass.css?v=256">
  <script>
    // applica subito tema e colore salvati (evita il lampo)
    try {
      // stile dell'app (Sport, Showroom, Cruscotto): alcuni decidono da soli chiaro/scuro
      const stile = localStorage.getItem('garage-stile');
      const temaStile = { sport: 'dark', showroom: 'light', cruscotto: 'dark' }[stile];
      if (temaStile || stile === 'minimal' || stile === 'glass') document.documentElement.dataset.stile = stile;
      if (stile === 'minimal' || stile === 'glass') document.documentElement.dataset.layout = 'nuovo';
      const t = temaStile || localStorage.getItem('garage-tema') || 'dark';
      if (t !== 'auto') document.documentElement.dataset.theme = t;
      const c = JSON.parse(localStorage.getItem('garage-colore-css') || 'null');
      if (c) for (const k in c) document.documentElement.style.setProperty(k, c[k]);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btnBack" aria-label="Indietro" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="pageTitle">Garage</h1>
    <button class="icon-btn" id="btnSync" aria-label="Sincronizza" hidden></button>
    <button class="icon-btn" id="btnTheme" aria-label="Temi e colori">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
    </button>
  </header>

  <main id="view" class="view"></main>

  <nav class="bottomnav">
    <a href="#home" data-nav="home">
      <svg viewBox="0 0 24 24"><path d="M4 18V9.5L12 4l8 5.5V18M7 18h10M8.5 14.5h7"/></svg>
      <span>Garage</span>
    </a>
    <a href="#movimenti" data-nav="movimenti">
      <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
      <span>Movimenti</span>
    </a>
    <button class="fab" id="btnAdd" aria-label="Aggiungi">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <a href="#statistiche" data-nav="statistiche">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Statistiche</span>
    </a>
    <a href="#altro" data-nav="altro">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      <span>Altro</span>
    </a>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" id="sheetClose" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="db.js?v=256"></script>
  <script src="calc.js?v=256"></script>
  <script src="charts.js?v=256"></script>
  <script src="sync.js?v=256"></script>
  <script src="viaggi.js?v=256"></script>
  <script src="drivvo.js?v=256"></script>
  <script src="app.js?v=256"></script>
</body>
</html>
